name: MathWrech Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================
  # Windows 7+
  # ==========================================
  windows:
    name: Windows 7+
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create temporary package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "mathwrech",
            "version": "0.0.1",
            "description": "MathWrech Desktop Application",
            "main": "index.js",
            "scripts": {
              "build": "electron-builder"
            },
            "devDependencies": {
              "electron": "22.3.27",
              "electron-builder": "24.13.3"
            },
            "build": {
              "appId": "com.mathwrech.mw",
              "productName": "MathWrech",
              "files": [
                "index.js",
                "index.html",
                "icon.ico"
              ],
              "win": {
                "target": "portable",
                "icon": "icon.ico"
              },
              "linux": {
                "target": [
                  "AppImage",
                  "deb"
                ],
                "category": "Utility"
              },
              "mac": {
                "target": [
                  "dmg",
                  "zip"
                ],
                "category": "public.app-category.utilities"
              }
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build -- --win

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: MathWrech-Windows-0.0.1
          path: dist/*


  # ==========================================
  # Linux
  # ==========================================
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create temporary package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "mathwrech",
            "version": "0.0.1",
            "description": "MathWrech Desktop Application",
            "main": "index.js",
            "scripts": {
              "build": "electron-builder"
            },
            "devDependencies": {
              "electron": "22.3.27",
              "electron-builder": "24.13.3"
            },
            "build": {
              "appId": "com.mathwrech.mw",
              "productName": "MathWrech",
              "files": [
                "index.js",
                "index.html",
                "icon.ico"
              ],
              "linux": {
                "target": [
                  "AppImage",
                  "deb"
                ],
                "category": "Utility"
              }
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build Linux
        run: npm run build

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: MathWrech-Linux-0.0.1
          path: dist/*


  # ==========================================
  # macOS
  # ==========================================
  macos:
    name: macOS
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create temporary package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "mathwrech",
            "version": "0.0.1",
            "description": "MathWrech Desktop Application",
            "main": "index.js",
            "scripts": {
              "build": "electron-builder"
            },
            "devDependencies": {
              "electron": "22.3.27",
              "electron-builder": "24.13.3"
            },
            "build": {
              "appId": "com.mathwrech.mw",
              "productName": "MathWrech",
              "files": [
                "index.js",
                "index.html",
                "icon.ico"
              ],
              "mac": {
                "target": [
                  "dmg",
                  "zip"
                ],
                "category": "public.app-category.utilities"
              }
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build macOS
        run: npm run build

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: MathWrech-macOS-0.0.1
          path: dist/*


  # ==========================================
  # GitHub Release
  # ==========================================
  release:
    name: Create GitHub Release

    needs:
      - windows
      - linux
      - macos

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: MathWrech-Windows-0.0.1
          path: release/windows

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: MathWrech-Linux-0.0.1
          path: release/linux

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: MathWrech-macOS-0.0.1
          path: release/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: MathWrech v0.0.1
          generate_release_notes: true
          files: |
            release/windows/*
            release/linux/*
            release/macos/*
